name: chegai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chegai
      POSTGRES_PASSWORD: chegai
      POSTGRES_DB: chegai
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chegai -d chegai']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    user: '0:0'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chegai
      MINIO_ROOT_PASSWORD: chegai-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  minio-setup:
    image: amazon/aws-cli:2.27.0
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: chegai
      AWS_SECRET_ACCESS_KEY: chegai-minio
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/minio/setup.sh:/setup.sh:ro
    entrypoint: ['/bin/sh', '/setup.sh']

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_SECURE_COOKIE: 'false'
    ports:
      - '5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  postgres-data:
  redis-data:
  minio-data:
  n8n-data:
